# キット自身の CI
# ※ 02_共通/ひな形/github/workflows/ 配下の yml は「配布先プロジェクトへ置くサンプル」であり、これとは別物。
#
# 回帰テスト（hooks / trace-check / quality_harness / 入口スクリプト / git ゲート / 工程承認 / check-docs / check-design）と
# 文書整合検査・デザイン検査を、保守者が Actions 画面から手動で起動したときだけ実行する（workflow_dispatch のみ）。
# PR や push で自動実行しない: ゲートは要求した時だけ動かす（02_共通/rules/speed-harness.md H-7）という
# キットの規律を CI にも適用する（保守者決定 2026-09-17「自動処理は認めない」）。
# 何を検査するかは 06_保守者向け/01_内部仕様/09-findings.md F-07 / F-09、internal/spec/11 D-2。GATES_REQUESTED=1 を明示する。

name: Kit CI

on:
  workflow_dispatch:

jobs:
  regression:
    name: 回帰テストと文書整合
    runs-on: ubuntu-latest
    env:
      GATES_REQUESTED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: hooks（stdin JSON）
        run: bash 06_保守者向け/03_回帰テスト/test-hooks.sh
      - name: trace-check（トレーサビリティ）
        run: bash 06_保守者向け/03_回帰テスト/test-trace-check.sh
      - name: quality_harness（機能契約）
        run: bash 06_保守者向け/03_回帰テスト/test-quality-harness.sh
      - name: 入口スクリプト（install / export / init）
        run: bash 06_保守者向け/03_回帰テスト/test-install.sh
      - name: git ゲート（pre-commit / .ui-verified / ui-hash）
        run: bash 06_保守者向け/03_回帰テスト/test-git-gates.sh
      - name: 工程承認ゲート（check-approval / phase-hash）
        run: bash 06_保守者向け/03_回帰テスト/test-check-approval.sh
      - name: テストメトリクス（test-metrics）
        run: bash 06_保守者向け/03_回帰テスト/test-test-metrics.sh
      - name: トークン監査（token-audit）
        run: bash 06_保守者向け/03_回帰テスト/test-token-audit.sh
      - name: check-docs の回帰テスト
        run: bash 06_保守者向け/03_回帰テスト/test-check-docs.sh
      - name: check-design の回帰テスト
        run: bash 06_保守者向け/03_回帰テスト/test-check-design.sh

      - name: デザイン検査（直値・未定義トークン・外部 CDN・alert()）
        run: bash 00_導入/03_点検/check-design.sh -o check-design-report.md

      - name: 文書整合検査（INDEX 参照コスト・掲載漏れ・ケース数・参照切れ・frontmatter・spec 同期）
        id: docs
        run: bash 06_保守者向け/03_回帰テスト/check-docs.sh -o check-docs-report.md

      # 失敗時も詳細レポートを残す（会話・ログには結論だけ、全件はここ）
      - name: レポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            check-docs-report.md
            check-design-report.md
          if-no-files-found: ignore
      - name: サマリ
        if: always()
        run: |
          for f in check-docs-report.md check-design-report.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
