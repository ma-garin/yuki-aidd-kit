# 秘密情報スキャン（gitleaks）
# .github/workflows/secret-scan.yml に配置
# マネーフォワード事例のような「うっかりコミット」を防ぐ。完全無料・APIキー不要。
# コミット時の即時防止は scripts/pre-commit（ローカルの git hook）が担う。CI は手動で全履歴を見直すとき用。
# 起動は手動のみ（workflow_dispatch）。PR や push で自動実行しない: ゲートは要求した時だけ動かす（rules/speed-harness.md H-7）。
# Actions 画面の「Run workflow」から起動する。

name: Secret Scan

on:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全履歴をスキャン
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
