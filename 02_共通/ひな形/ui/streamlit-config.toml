# .streamlit/config.toml — AIDD Design System の Streamlit テーマ（ライト）
# 値の真実源: 02_共通/ひな形/tokens.css ／ 規律: skills/design-system/SKILL.md
# Streamlit はテーマ変数を CSS 変数として公開しないため、ここは tokens.css の「写し」。値を変えるときは tokens.css を先に直す。
# 配置: <project>/.streamlit/config.toml。追加の見た目は streamlit_theme.py の apply_theme() に集約する。

[theme]
base = "light"
primaryColor = "#1976D2"             # --color-primary
backgroundColor = "#F8F9FA"          # --color-bg
secondaryBackgroundColor = "#F1F3F4" # --color-surface-2（サイドバー・入力欄）
textColor = "#212121"                # --color-text
font = "sans serif"                  # --font-main 相当（Noto Sans JP はブラウザのシステムフォント経由）
