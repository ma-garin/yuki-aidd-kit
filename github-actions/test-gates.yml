# テスト活動のゲート（機能契約ハーネス + L1/L2）— Python / Node 両対応
# .github/workflows/test-gates.yml に配置（./scripts/init-test-docs.sh <target> --ci で自動配置）
# スタックはファイルの有無で自動判定: pyproject.toml / requirements*.txt → pytest、package.json → npm test（vitest 等）。
# L3（E2E）はマイルストーンで手動実行し .ui-verified を更新する運用（skills/test-strategy）。CI でも回す場合は末尾の verify-ui を有効化。

name: Test Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Functional Integrity Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: quality_harness
        run: python3 scripts/quality_harness.py --root .

  unit-integration:
    name: L1/L2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Python（pyproject.toml か requirements*.txt があるとき） ──
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt') != ''
        with:
          python-version: "3.12"
      - name: pytest with coverage gate
        if: hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>/dev/null || true; fi
          pip install pytest pytest-cov
          GATES_REQUESTED=1 python -m pytest tests/ --ignore=tests/e2e -q --tb=short --cov=. --cov-fail-under=80

      # ── Node（package.json があるとき。vitest / jest は npm test に集約しておく） ──
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "22"
          cache: npm
      - name: npm test with coverage gate
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          GATES_REQUESTED=1 npm test -- --run --coverage --coverage.thresholds.lines=80 2>/dev/null \
            || GATES_REQUESTED=1 npm test

      - name: nothing to test
        if: hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt', 'package.json') == ''
        run: echo "::warning::pyproject.toml / requirements*.txt / package.json が無いため L1/L2 を実行していません（未実行）"

